[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niess-ditto"
dynamic = ["version"]
description = 'The DITTO interface for Neutron Instruments of the ESS'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Gregory Tucker", email = "gregory.tucker@ess.eu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "nicos_ess",
  # 0.35 (unreleased) drops a split's unused USERVARS, so samples share one primary
  "mccode-antlr>=0.34.0",
  # 0.26.1 points kafka-to-nexus at the template in its working directory
  "mccode-plumber>=0.26.1",
  # 0.18.1 compiles a copy, so a later count still finds its cached primary
  "restage>=0.18.1",
  "chopcal>=0.8.0",
  "confluent-kafka",
  "h5py",
]

[project.urls]
Documentation = "https://github.com/Gregory Tucker/niess-ditto#readme"
Issues = "https://github.com/Gregory Tucker/niess-ditto/issues"
Source = "https://github.com/Gregory Tucker/niess-ditto"

[tool.hatch.version]
path = "src/niess_ditto/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/niess_ditto tests}"

[tool.coverage.run]
source_pkgs = ["niess_ditto", "tests"]
branch = true
parallel = true
omit = [
  "src/niess_ditto/__about__.py",
]

[tool.coverage.paths]
niess_ditto = ["src/niess_ditto", "*/niess-ditto/src/niess_ditto"]
tests = ["tests", "*/niess-ditto/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.uv.sources]
nicos_ess = { index = "ecdc-pypi" }

[[tool.uv.index]]
name = "ecdc-pypi"
url = "https://artifactory.esss.lu.se/artifactory/api/pypi/ecdc-pypi/simple"
cache-control = { api = "max-age=600", files = "max-age=365000000, immutable" }
